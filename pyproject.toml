[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cvagent"
version = "0.1.0"
description = "把甘蓝航拍检测封装成可编排的视觉 Agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ultralytics==8.4.194",
    "requests>=2.31",
    "pillow>=10.0",
]

[project.scripts]
cvagent = "cvagent.cli:main"

[project.optional-dependencies]
# 只有 `cvagent serve` 这条路要用。不塞进核心依赖，是因为 CLI 的
# ask / detect / replay 完全不需要 HTTP 栈，装了只是拖慢安装。
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvagent = ["web/*.html"]
