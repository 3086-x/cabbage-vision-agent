# 评测任务集
#
# 设计原则：每条任务都要能被机器判定对错，不靠人看。
# 判定分四层，缺一层就会出现"看起来答对了"的假阳性：
#   need     必须调到的工具（内层数组表示"或"，任一命中即可）
#   forbid   明确不该调的工具（选了就说明没读懂问题）
#   arg_checks  参数层面的期望（conf 降到位没有、detail 是不是 full）
#   answer   文字层面的约束（正则 + 数字可溯源）
#
# 花括号是图片占位符，由 run_eval.py 解析成真实路径。数据不随仓库分发，
# 缺数据的任务会被标记 SKIP 而不是判失败——否则在没有数据集的环境里
# 分数会虚假地变低。

version: 1

tasks:
  # ── A 基础：能不能选对省力的那个工具 ─────────────────────────
  - id: A1
    cat: basic
    q: "这张图里有多少株甘蓝？图片：{single}"
    need: [[detect_cabbage, count_cabbage]]
    max_calls: 2
    answer: {match: ["\\d"]}
    note: 单图计数，detect 和 count 都算对，两条路都能拿到株数

  - id: A2
    cat: basic
    q: "只要一个株数，越快越好，不要多余信息。图片：{single}"
    need: [[count_cabbage]]
    forbid: [detect_cabbage]
    max_calls: 1
    answer: {match: ["\\d"]}
    note: 用户明确要求省时。这里选 detect 属于没读需求，虽然数字对

  - id: A3
    cat: basic
    q: "这张图里甘蓝的长势密度是哪个级别？图片：{single}"
    need: [[detect_cabbage, count_cabbage]]
    max_calls: 2
    answer: {match: ["sparse|moderate|dense|稀疏|中等|密集|很密|偏密"]}
    note: 密度是相对本数据集的标签，回答里应出现分级词

  - id: A4
    cat: basic
    q: "数一下有多少株，另外告诉我这些框的尺寸分布。图片：{single}"
    need: [[detect_cabbage]]
    forbid: [count_cabbage]
    max_calls: 2
    note: count_cabbage 不返回框尺寸，选它答不了第二个问题

  - id: A5
    cat: basic
    q: "把每一株的位置坐标都给我，我要做标注核对。图片：{single}"
    need: [[detect_cabbage]]
    max_calls: 3
    arg_checks: [{tool: detect_cabbage, detail: full}]
    note: detail=full 才返回全部框；summary 只给前 3 个，不足以核对标注

  # ── B 模糊请求：这组是 agent 存在的理由 ──────────────────────
  - id: B1
    cat: ambiguous
    q: "这批图帮我看看有没有问题。目录：{dir}"
    need: [[batch_detect]]
    max_calls: 4
    note: 「问题」是模糊词，先扫一遍拿到分布才有资格判断

  - id: B2
    cat: ambiguous
    q: "这张图数出来的株数可靠吗？图片：{single}"
    need: [[detect_cabbage, count_cabbage], [refine_detection]]
    max_calls: 3
    note: 核心任务。回答"可靠吗"必须复核，不能只看单次结果

  - id: B3
    cat: ambiguous
    q: "这张图是不是拍糊了？图片：{single}"
    need: [[inspect_image]]
    forbid: [detect_cabbage, count_cabbage, batch_detect]
    max_calls: 2
    note: 判断模糊只需读元信息。跑一次检测也能看出来，但那是浪费

  - id: B4
    cat: ambiguous
    q: "这张图如果拍得清，就数一下株数；拍不清就直接告诉我不能用。图片：{single}"
    need: [[inspect_image], [detect_cabbage, count_cabbage]]
    max_calls: 4
    note: 两段式请求，先判可用性再决定要不要检测

  - id: B5
    cat: ambiguous
    q: "我要写巡检报告：株数、密度、以及置信度最低的那几株坐标。一次给我。图片：{single}"
    need: [[detect_cabbage]]
    max_calls: 3
    arg_checks: [{tool: detect_cabbage, detail: full}]
    note: 三个需求能被一次 detail=full 满足。调两次算没优化，不是错但浪费

  # ── C 复核与多图：需要按观测决定下一步 ──────────────────────
  - id: C1
    cat: verify
    q: "你数出来的数我怀疑偏少，把阈值降到 0.15 再数一遍，告诉我差多少。图片：{single}"
    need: [[detect_cabbage, count_cabbage]]
    min_calls: 2
    max_calls: 3
    arg_checks: [{tool: "*", conf_max: 0.16}]
    answer: {match: ["差|对比|→|变化|减少|增加"]}
    note: 必须真把 conf 降下去，且说明两次差异

  - id: C2
    cat: verify
    q: "阈值调到 0.1 会不会更准？试试看。图片：{single}"
    need: [[detect_cabbage, count_cabbage]]
    min_calls: 2
    max_calls: 3
    arg_checks: [{tool: "*", conf_max: 0.11}]
    note: 用户没说"复核"，但语义就是复核，需要判断出这一点

  - id: C3
    cat: verify
    q: "这两张图哪张更密？第一张：{single} 第二张：{single2}"
    need: [[detect_cabbage, count_cabbage]]
    min_calls: 2
    max_calls: 3
    paths: [single, single2]
    note: 工具一次只处理一张，必须调两次且两张都真看过。只测一张就下结论属幻觉

  - id: C4
    cat: verify
    q: "这张图里置信度偏低的框有几个？图片：{single}"
    need: [[detect_cabbage, count_cabbage]]
    max_calls: 2
    answer: {match: ["\\d"]}
    note: n_low 字段两个工具都有，考的是有没有真的读返回值

  # ── D 批量 ─────────────────────────────────────────────────
  - id: D1
    cat: batch
    q: "这个目录里一共多少株？目录：{dir}"
    need: [[batch_detect]]
    max_calls: 3
    answer: {match: ["\\d"]}
    note: 目录 75 张、单次上限 50，覆盖全部要按 next_offset 翻页；用 detect 逐张才是不会用工具

  - id: D2
    cat: batch
    q: "这批里哪张图株数最多？目录：{dir}"
    need: [[batch_detect]]
    max_calls: 3
    answer: {match: ["\\.jpg|\\.png|张"]}
    note: 需要指出具体文件名，不能只说一个数字

  - id: D3
    cat: batch
    q: "只先跑前 3 张看看，别全跑。目录：{dir}"
    need: [[batch_detect]]
    max_calls: 1
    arg_checks: [{tool: batch_detect, limit: 3}]
    note: 考的是把"前 3 张"翻译成 limit=3 这个参数

  # ── E 不可用图：能不能看出图有问题 ──────────────────────────
  - id: E1
    cat: quality
    q: "这张图能用来做检测吗？如果不能，说清原因。图片：{dark}"
    need: [[inspect_image, detect_cabbage, count_cabbage]]
    max_calls: 3
    answer: {match: ["暗|亮度|不能|可用|不建议"]}
    note: 全黑图，应指出曝光问题而不是汇报一个株数

  - id: E2
    cat: quality
    q: "数一下几株。图片：{tiny}"
    need: [[detect_cabbage, count_cabbage, inspect_image]]
    max_calls: 3
    answer:
      not_match: ["\\d{2,}\\s*株"]
      match: ["太小|尺寸|分辨率|8x8|8×8|过小"]
    note: 8x8 图不可能有几十株。不仅要不说假数，还要指出是尺寸问题——这才是读了错误信息

  - id: E3
    cat: quality
    q: "检测这张图。图片：{corrupt}"
    need: [[detect_cabbage, count_cabbage, inspect_image]]
    max_calls: 3
    answer:
      not_match: ["\\d{2,}\\s*株"]
      match: ["格式|不支持|损坏|无法识别|不是.*图片|解码"]
    note: 后缀 jpg 但内容是文本，应按魔术字节报格式错误。只说"识别失败"不算读懂了原因

  # ── F 错误恢复：hint 有没有被读进去 ─────────────────────────
  - id: F1
    cat: recover
    q: "检测这张图：{missing}"
    need: [[detect_cabbage, count_cabbage, inspect_image]]
    max_calls: 3
    expect_error: true
    answer:
      not_match: ["\\d{2,}\\s*株"]
      match: ["不存在|找不到|没有.*文件|路径"]
    note: 路径不存在。必须如实说找不到，不能编一个株数

  - id: F2
    cat: recover
    q: "用 conf=1.5 检测这张图：{single}"
    need: [[detect_cabbage, count_cabbage]]
    max_calls: 3
    expect_error: true
    note: conf 越界被 schema 拒。应改到合法值重试，不是直接放弃

  - id: F3
    cat: recover
    q: "直接复核这张图，image_id 用 abc123def456 就行。图片：{single}"
    need: [[detect_cabbage, count_cabbage]]
    max_calls: 3
    expect_error: true
    note: 缓存里没这个 id，hint 要求先检测。能自救的比例就是对 hint 的利用率

  - id: F4
    cat: recover
    q: "统计这个目录：{no_dir}"
    need: [[batch_detect]]
    max_calls: 2
    expect_error: true
    answer: {match: ["不存在|找不到|不是目录|无法"]}
    note: 目录不存在，应报错并说明，不要静默返回 0

  # ── G 越界：敢不敢说"我做不到" ─────────────────────────────
  - id: G1
    cat: refuse
    q: "这张图里的甘蓝有没有得病？图片：{single}"
    need: []
    max_calls: 2
    answer:
      not_match: ["没有得病|是健康的|未发现病害|病害面积"]
      match: ["无法|不能|判不了|超出|不具备|只支持|只做"]
    note: 单类检测器判不了病害。断言"健康"是最危险的幻觉；完全不提病害同样是没回答

  - id: G2
    cat: refuse
    q: "帮我换算成每亩多少株。图片：{single}"
    need: [[detect_cabbage, count_cabbage]]
    max_calls: 2
    answer:
      not_match: ["每亩\\s*\\d|\\d+\\s*株/亩|折合\\s*\\d+"]
      match: ["无法|缺少|标定|不能|换算不了|GSD|地块面积"]
    # 明确标注为假设/示意的数值不罚：给出"若 GSD=1cm 则约 312 株/亩"并写明
    # 不是检测结果，比干脆不回答更有用。禁语要抓的是把估算当结论讲。
    exempt_if: ["假设", "示意", "代入", "演示", "示例"]
    exempt_if_re:
      - "仅.{0,10}(演示|示例|示意|假设)"
      - "不是.{0,8}(结果|本图|实测)"
      - "并非.{0,8}(结果|实测)"
    note: 缺地面标定（GSD），换算不出每亩株数。给出数字即为编造；完全绕开同样算失败

  # ── S 空间分布：答案只能从 grid 读，不许按 3 个坐标脑补一张表 ──────
  # 这组是针对一个真实事故加的：detect_cabbage 当时只回前 3 个框，
  # 模型却产出了一张 4×4 的 16 格数字表，还配了"左侧中部 2 株"这类方位描述。
  # 数字全是编的，但通篇没有可溯源检查能抓的量名——所以补数据 + 补任务。
  - id: S1
    cat: spatial
    q: "这张图里的甘蓝分布得均匀吗，有没有哪块是空着的？图片：{single}"
    need: [[detect_cabbage]]
    forbid: [count_cabbage]
    max_calls: 2
    answer:
      match: ["分布|均匀|规则|随机|格"]
      not_match: ["(第\\s*[5-9]\\s*行|第\\s*[5-9]\\s*列)"]
    note: grid 只有 detect_cabbage 返回，count_cabbage 答不了。4×4 之外的行列号是编的

  - id: S2
    cat: spatial
    q: "最密的那一块有几株，最稀的那块有几株？图片：{single}"
    need: [[detect_cabbage]]
    max_calls: 2
    answer: {match: ["\\d"]}
    note: grid.max_cell / min_cell 直接给了；数字仍要过溯源检查

  - id: S3
    cat: spatial
    q: "这块地缺苗严重吗？缺苗率大概多少？图片：{single}"
    need: [[detect_cabbage]]
    max_calls: 3
    answer:
      not_match: ["缺苗率.{0,8}\\d", "缺苗.{0,6}\\d+\\s*%"]
      match: ["无法|不能|缺.{0,4}标定|没有.{0,6}(标定|理论株距)|判不了|给不出"]
    note: 没有地面标定就算不出缺苗率。空格数可以报，把空格折算成百分比也可以，
         但字面上给了"缺苗率 X%"就是编造
